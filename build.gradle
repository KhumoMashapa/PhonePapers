// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript  {
    ext{
        kotlin_version = "1.8.0"
        supportlibVersion = '1.2.0-alpha05'
        room_version = '2.1.0-alpha04'
        coroutine_version = '1.6.4'

        // App dependencies
        appCompatVersion = "1.2.0"
        constraintLayoutVersion = "2.0.4"
        coroutinesVersion = '1.6.1-native-mt'
        dataStoreVersion = '1.0.0'
        espressoVersion = "3.3.0"
        fragmentVersion = "1.3.0-beta01"
        //gradleVersion = '4.2.0-beta06'
        hiltAndroidXVersion = '1.0.0'
        hiltVersion = '2.45'
        junitVersion = "4.13.1"
        kotlinVersion = "1.4.10"
        ktxVersion = "1.3.2"
        lifecycleVersion = "2.2.0"
        materialVersion = "1.3.0-alpha03"
        navigationVersion = '2.5.3'
        roomVersion = "2.2.5"
        testExtJunitVersion = "1.1.2"

    }

    repositories {
        google()
        mavenCentral()

        maven { url 'https://jitpack.io' }
    }
    dependencies {
        //noinspection AndroidGradlePluginVersion
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20-RC'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hiltVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        


        // Warning: this repository is going to shut down soon
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}