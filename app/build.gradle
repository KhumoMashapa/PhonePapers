plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android'
    id 'com.google.gms.google-services'
    id 'kotlin-kapt'
}

android {
    namespace 'com.khumomashapa.mywallpapers'
    compileSdk = 36

    defaultConfig {

        applicationId "com.khumomashapa.mywallpapers"
        minSdk 24
        targetSdk 36
        // LAST LIVE VERSION: 37 (Increment below ONLY after a release)
        versionCode 38
        versionName "1.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0-alpha10'
    //implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.firebase:firebase-database:22.0.1'
    implementation 'com.google.firebase:firebase-storage-ktx:21.0.2'
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    implementation 'com.android.billingclient:billing:8.3.0'
    implementation 'com.melnykov:floatingactionbutton:1.3.0'
    implementation 'me.zhanghai.android.fastscroll:library:1.3.0'
    implementation 'androidx.compose.runtime:runtime:1.10.5'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}